<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#07090d">
<title>Cedar Creek Deal Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>/*__CSS__*/</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="logo">CC</div><div><div class="t1">Cedar Creek</div><div class="t2">Deal Screen</div></div></div>
  <input class="deal-name" id="dealName" type="text" placeholder="Untitled deal" aria-label="Deal name">
  <div class="actions">
    <button class="btn ghost opt" id="btnNew" title="Start a new deal">New</button>
    <button class="btn opt" id="btnPrint" title="Print one-page summary">Print</button>
    <button class="btn primary" id="btnSave" title="Save to deal list">Save</button>
  </div>
</header>

<section class="hero">
  <div class="verdict-card">
    <div class="ring" id="ring">
      <svg width="100%" height="100%" viewBox="0 0 84 84"><circle class="track" cx="42" cy="42" r="36" fill="none" stroke-width="7"/><circle class="val" id="ringVal" cx="42" cy="42" r="36" fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="226.2" stroke-dashoffset="226.2"/></svg>
      <div class="lbl"><div><b id="scoreTxt">—</b><small>score</small></div></div>
    </div>
    <div style="min-width:0">
      <span class="badge tone-none" id="verdict">Awaiting data</span>
      <div class="verdict-reason" id="reason">Drop a broker PDF or paste teaser text to start.</div>
    </div>
  </div>
  <div class="kpis" id="kpis"></div>
</section>

<main class="layout">
  <aside class="side">
    <nav class="tabs" id="sideTabs">
      <button data-view="ingest">Ingest</button>
      <button data-view="review">Review <span class="n" id="missingCount" hidden></span></button>
      <button data-view="inputs">Inputs</button>
      <button data-view="deals">Deals</button>
    </nav>
    <div class="pane" data-pane="ingest" id="paneIngest"></div>
    <div class="pane" data-pane="review" id="paneReview"></div>
    <div class="pane" data-pane="inputs" id="paneInputs"></div>
    <div class="pane" data-pane="deals" id="paneDeals"></div>
  </aside>
  <section class="analysis" id="analysis"></section>
</main>

<nav class="tabbar" id="tabbar">
  <button data-view="ingest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4m0 0l-4 4m4-4l4 4M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg>Ingest</button>
  <button data-view="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l2 2 4-4M5 4h14v16H5z"/></svg>Review</button>
  <button data-view="analysis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5m0 14h16M8 15l3-4 3 2 5-6"/></svg>Analysis</button>
  <button data-view="inputs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h10m4 0h2M4 12h4m4 0h8M4 18h12m4 0h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Inputs</button>
  <button data-view="deals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Deals</button>
</nav>

<div id="print-sheet"></div>
<input type="file" id="fileInput" accept="application/pdf,.pdf,.txt,text/plain" hidden>
<script>/*__JS__*/</script>
</body>
</html>
